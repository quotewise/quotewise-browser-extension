<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 350px; padding: 10px; font-family: Arial, sans-serif; }
        .tweet-data { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .author { font-weight: bold; }
        .text { margin: 10px 0; }
        .metrics { font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <h3>Quotewise - Test Popup</h3>
    <div id="status">Loading...</div>
    <div id="tweet-data" style="display: none;"></div>
    
    <hr style="margin: 15px 0;">
    <h4>API Testing</h4>
    <button id="test-auth" style="margin: 5px;">Test Auth Status</button>
    <div id="auth-result" style="margin: 10px 0; padding: 10px; border: 1px solid #ddd; display: none;"></div>
    
    <button id="test-search" style="margin: 5px;">Test Originator Search</button>
    <input id="search-query" placeholder="Search for originator..." style="margin: 5px; padding: 5px; width: 200px;">
    <div id="search-result" style="margin: 10px 0; padding: 10px; border: 1px solid #ddd; display: none;"></div>
    
    <button id="test-duplicate" style="margin: 5px;">Test Duplicate Check</button>
    <input id="quote-text" placeholder="Enter quote text..." style="margin: 5px; padding: 5px; width: 200px;">
    <div id="duplicate-result" style="margin: 10px 0; padding: 10px; border: 1px solid #ddd; display: none;"></div>
    
    <script src="test-popup.js"></script>
</body>
</html>
